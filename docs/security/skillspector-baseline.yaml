- hash: sha256:a2bf3f062409d38f
  rule_id: P1
  file: assess-energy-shock/SKILL.md
  reason: 'Reviewed 2026-07-27 (static-only scan, no LLM filter): every P1/YR4 match in the
    vendored koala73/worldmonitor economic-intelligence skills traces to the same ''Content
    safety'' section each SKILL.md includes verbatim: a disclaimer instructing the agent to
    treat API response fields as data, never as instructions, and quoting the literal phrase
    ''ignore previous instructions'' as the example text to disregard. The static pattern
    matcher and the YARA rule ''agent_skill_prompt_injection_hidden_instructions'' cannot
    distinguish a prohibition from the act itself, so the anti-injection warning trips the
    same rule it is warning against — the same false-positive shape already reviewed for the
    vendored obra/superpowers skill set above. No finding traces to exploit code, credential
    access, or a real embedded instruction override. See docs/security/skill-vetting.md for
    the full review. These skills call a live third-party API (api.worldmonitor.app) that
    requires an API key; no key is configured anywhere in this repo or its secrets, so the
    skills are vendored for reference only and are inert until a Founder decision provisions
    credentials.'
